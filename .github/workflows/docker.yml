name: Docker Build & Security Scan

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------------------
      # Checkout Repository
      # ----------------------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Setup Docker Buildx
      # ----------------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------------------
      # Login to GitHub Container Registry
      # ----------------------------------------------------------------------

      - name: Login to GHCR
        if: github.event_name != 'pull_request'

        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------------
      # Build Backend Image
      # ----------------------------------------------------------------------

      - name: Build Backend Docker Image

        uses: docker/build-push-action@v6

        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          load: true
          tags: backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # Smoke-Test Backend Image
      # ----------------------------------------------------------------------

      - name: Smoke-Test Backend Image

        run: |
          docker rm -f backend-smoke 2>/dev/null || true
          trap 'docker rm -f backend-smoke 2>/dev/null || true' EXIT

          docker run -d --name backend-smoke -p 8000:8000 \
            -e DATABASE_URL="postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder" \
            -e JWT_SECRET="ci-smoke-test-placeholder-not-a-real-secret" \
            backend:latest

          healthy=""
          for i in $(seq 1 15); do
            if ! docker ps -q -f name=backend-smoke -f status=running | grep -q .; then
              echo "Container exited early"
              break
            fi
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done

          echo "----- container logs -----"
          docker logs backend-smoke || true

          if [ -z "$healthy" ]; then
            echo "::error::Backend image failed to become healthy within 15s"
            exit 1
          fi

      # ----------------------------------------------------------------------
      # Build Frontend Image
      # ----------------------------------------------------------------------

      - name: Build Frontend Docker Image

        uses: docker/build-push-action@v6

        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          load: true
          tags: frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------------------------------------------------
      # Scan Backend Image
      # ----------------------------------------------------------------------
      # trivy-action@v0.31.0 pinned an old Trivy version (v0.63.0) whose
      # setup-trivy install step fails outright (install.sh exits 1 before
      # any scan runs, confirmed via direct log inspection — not a network
      # flake). Bumped to the current release (v0.36.0), which resolves a
      # current Trivy version through a working install path.

      - name: Scan Backend Image

        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: backend:latest
          format: sarif
          output: backend-trivy.sarif
          severity: CRITICAL,HIGH

      # ----------------------------------------------------------------------
      # Scan Frontend Image
      # ----------------------------------------------------------------------

      - name: Scan Frontend Image

        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: frontend:latest
          format: sarif
          output: frontend-trivy.sarif
          severity: CRITICAL,HIGH

      # ----------------------------------------------------------------------
      # Upload Backend Security Report
      # ----------------------------------------------------------------------
      # Explicit, distinct `category` per upload — without it both uploads
      # default to the same category (tool + workflow job path) and the
      # second one is rejected by GitHub's SARIF API as a duplicate.

      - name: Upload Backend SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:
          sarif_file: backend-trivy.sarif
          category: trivy-backend

      # ----------------------------------------------------------------------
      # Upload Frontend Security Report
      # ----------------------------------------------------------------------

      - name: Upload Frontend SARIF

        uses: github/codeql-action/upload-sarif@v3

        with:
          sarif_file: frontend-trivy.sarif
          category: trivy-frontend

      # ----------------------------------------------------------------------
      # Push Backend Image
      # ----------------------------------------------------------------------

      - name: Push Backend Image

        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

        uses: docker/build-push-action@v6

        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      # ----------------------------------------------------------------------
      # Push Frontend Image
      # ----------------------------------------------------------------------

      - name: Push Frontend Image

        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

        uses: docker/build-push-action@v6

        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}