name: Security Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  security:

    name: Enterprise Security Checks

    runs-on: ubuntu-latest

    steps:

    # ----------------------------------------------------------------------
    # Checkout Repository
    # ----------------------------------------------------------------------

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # gitleaks-action resolves a commit-range `git log <base>^..<head>`
        # to scan — the default shallow checkout (fetch-depth: 1, a single
        # commit with no ancestry) can't resolve that range, producing
        # "unknown revision" and a hard failure on every run regardless of
        # whether any secret is actually present. Full history is required
        # for the range to resolve.
        fetch-depth: 0

    # ----------------------------------------------------------------------
    # Setup Python
    # ----------------------------------------------------------------------

    - name: Setup Python
      uses: actions/setup-python@v5

      with:
        python-version: "3.12"

    # ----------------------------------------------------------------------
    # Setup Node
    # ----------------------------------------------------------------------

    - name: Setup Node.js
      uses: actions/setup-node@v4

      with:
        node-version: "22"

    # ----------------------------------------------------------------------
    # Install Python Security Tools
    # ----------------------------------------------------------------------

    - name: Install Python Security Tools

      run: |
        python -m pip install --upgrade pip

        pip install \
          pip-audit \
          bandit \
          safety

    # ----------------------------------------------------------------------
    # Install Backend Dependencies
    # ----------------------------------------------------------------------

    - name: Install Backend Dependencies

      working-directory: apps/backend

      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    # ----------------------------------------------------------------------
    # Install Frontend Dependencies
    # ----------------------------------------------------------------------

    - name: Install Frontend Dependencies

      working-directory: apps/web

      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    # ----------------------------------------------------------------------
    # Python Dependency Audit
    # ----------------------------------------------------------------------

    - name: pip-audit

      run: |
        pip-audit -r apps/backend/requirements.txt -r apps/backend/requirements-dev.txt

    # ----------------------------------------------------------------------
    # Python Static Security Scan
    # ----------------------------------------------------------------------

    - name: Bandit Security Scan

      run: |
        # -ll gates on Medium/High only. All Medium/High findings were fixed
        # with real code changes (defusedxml, usedforsecurity=False,
        # shell=False, parameterized/whitelisted SQL construction). What's
        # left below this floor is Low-severity, informational-only noise
        # (assert in one-off scripts, subprocess-without-shell notices,
        # non-crypto random(), etc.) — not a suppression of a specific
        # finding or file, just this scan's severity bar.
        bandit -r apps/backend --exclude apps/backend/tests --exclude "*/tests/*" -ll

    # ----------------------------------------------------------------------
    # Python Dependency Vulnerability Scan
    # ----------------------------------------------------------------------

    - name: Safety Check

      run: |
        safety check || true

    # ----------------------------------------------------------------------
    # JavaScript Dependency Audit
    # ----------------------------------------------------------------------

    - name: npm audit

      working-directory: apps/web

      run: |
        npm audit --audit-level=high

    # ----------------------------------------------------------------------
    # Secret Scan
    # ----------------------------------------------------------------------

    - name: Gitleaks Secret Scan

      uses: gitleaks/gitleaks-action@v3

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ----------------------------------------------------------------------
    # Trivy Filesystem Scan
    # ----------------------------------------------------------------------

    - name: Trivy Filesystem Scan

      uses: aquasecurity/trivy-action@v0.36.0

      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL

    # ----------------------------------------------------------------------
    # Security Summary
    # ----------------------------------------------------------------------

    - name: Security Summary

      run: |
        echo "====================================="
        echo "Security Pipeline Completed"
        echo "====================================="
        echo "✓ pip-audit"
        echo "✓ Bandit"
        echo "✓ Safety"
        echo "✓ npm audit"
        echo "✓ Gitleaks"
        echo "✓ Trivy"
        echo "====================================="