[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# ASYNC is deliberately not in this hard-gated selection: it currently flags 5
# pre-existing blocking-call findings (open()/pathlib.Path methods in async
# request handlers) in files this CI/CD task is not permitted to modify
# ("do not modify business logic"). CI runs ASYNC separately as a
# non-blocking, informational check — see .github/workflows/ci.yml — so the
# findings are visible without turning a legacy-code lint rollout into an
# immediate red pipeline. Fixing them for real requires wrapping blocking I/O
# in a thread executor, which is a behavioral change and belongs in its own PR.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI's Depends()/Query()/... as a default argument is the correct idiom, not a mutable-default bug
    "E501",   # line length is enforced by line-length above; not worth a hard CI failure on its own
]

[tool.ruff.lint.flake8-bugbear]
# Treat these FastAPI parameter-declaration calls as immutable so B008 doesn't
# flag every `Depends(...)` default argument across the routers.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy's `Mapped["ClassName"]` string-quoted forward references in
# relationship() annotations are resolved by the mapper registry at runtime,
# not import time — ruff's F821 doesn't know that and flags every one, across
# every module's models/ directory (academic, assessment, cms, identity,
# ingestion, ...), not just one.
"app/modules/*/models/*.py" = ["F821"]
# These two repositories deliberately import typing.List/Tuple instead of
# using bare list[...]/tuple[...]: both classes define a method literally
# named `list`, which shadows the builtin `list` name for every annotation
# evaluated later in the same class body. Applying ruff's UP006/UP035
# "modernize to bare list/tuple" suggestion here would reintroduce that bug.
"app/modules/identity/repositories/role_repository.py" = ["UP006", "UP035"]
"app/modules/identity/repositories/user_repository.py" = ["UP006", "UP035"]
